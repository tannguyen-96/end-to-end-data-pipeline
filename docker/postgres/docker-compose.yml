services:
  postgres:
    # pgvector/pgvector:pg17-trixie is postgres:17 (Debian 13) plus the `vector`
    # extension, needed by public.review_embeddings in data/ddl.sql. The -trixie
    # variant matters: postgres:17 is Debian 13 / glibc 2.41, and the plain
    # pg17 tag is Debian 12 / glibc 2.36, which makes the existing data volume
    # warn "database was created using collation version 2.41".
    image: pgvector/pgvector:pg17-trixie
    container_name: zomato-source
    networks: [cdc-net]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=5GB"]
    restart: unless-stopped
    # Single source of truth: the repo-root .env (POSTGRES_USER/PASSWORD/DB/PORT).
    env_file: ../../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ -> a literal $, so the container's shell expands POSTGRES_USER/POSTGRES_DB
      # (the values injected above from the root .env).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

networks:
  cdc-net:
    external: true