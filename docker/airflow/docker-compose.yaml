# Local Airflow 3.x (LocalExecutor) on Docker.
# Airflow 3 differences vs 2.x: webserver -> api-server, a separate dag-processor,
# and the FAB auth manager for classic admin/admin login.
#   All config comes from the repo-root .env (no per-stack .env):
#   docker compose --env-file ../../.env build && docker compose --env-file ../../.env up -d
#   UI: http://localhost:8080 (admin/admin)
x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ''
    # Airflow 3 signs inter-component (execution API) calls with this JWT secret:
    AIRFLOW__API_AUTH__JWT_SECRET: 'change-me-please-a-random-secret'
    # CRITICAL in multi-container Airflow 3: tasks reach the Execution API by the api-server's
    # SERVICE NAME, not localhost. Without this, tasks die → "state mismatch ... failed".
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://apiserver:8080/execution/'
    # The pipeline Postgres (container `zomato-source`, docker/postgres) is reached via the
    # Docker host gateway. This OVERRIDES POSTGRES_HOST=localhost from the root .env, which
    # is right for the host scripts (data/import_data.py) but wrong from inside a container.
    POSTGRES_HOST: host.docker.internal
    # Kafka config (KAFKA_BOOTSTRAP_SERVERS, KAFKA_GROUP_ID) comes from the root .env
    # via env_file; the kafka_to_s3 DAG reads them from the process environment.
    # Snowflake conn, assembled from the SNOWFLAKE_* vars in the root .env, so compose needs
    # --env-file ../../.env for these to interpolate.
    AIRFLOW_CONN_SNOWFLAKE_DEFAULT: '{"conn_type":"snowflake","login":"${SNOWFLAKE_USER}","password":"${SNOWFLAKE_PASSWORD}","schema":"RAW","extra":{"account":"${SNOWFLAKE_ACCOUNT}","warehouse":"OLIST_WH","database":"OLIST","role":"DBT_ROLE"}}'
  # Single source of truth: the repo-root .env feeds SNOWFLAKE_*, AWS_*, S3_BUCKET,
  # GEMINI_API_KEY and POSTGRES_* straight into every Airflow container.
  env_file:
    - ../../.env
  volumes:
    - ./dags:/opt/airflow/dags
    # Named volume (not a bind mount): on Windows a bind-mounted logs/ is root:root 755,
    # so the airflow user (uid 50000) cannot create logs/dag_processor/... and the
    # dag-processor crash-loops. The volume inherits the image's airflow-owned dir.
    - logs:/opt/airflow/logs
    #- ../olist-dbt:/opt/airflow/dbt/olist
    #- ../ai:/opt/airflow/ai
  # Shared with Postgres + Kafka so tasks can consume Kafka by service name (kafka:9092).
  networks:
    - default
    - cdc-net
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  apiserver:
    <<: *airflow-common
    command: api-server          # Airflow 3: replaces `webserver`
    ports: ["8080:8080"]
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor       # Airflow 3: DAG parsing is its own component
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  logs:

# External network shared with docker/postgres (zomato-source) and docker/kafka-debezium.
# Created once with: docker network create cdc-net  (see note.txt)
networks:
  cdc-net:
    external: true