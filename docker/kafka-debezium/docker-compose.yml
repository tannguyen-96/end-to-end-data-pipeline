services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    networks: [default, cdc-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Fallback partition count for auto-created topics (e.g. a future Debezium
      # table added to table.include.list). The 7 known CDC topics are pre-created
      # with per-topic counts (order_items=12, orders=8, menu=4, food/reviews=2,
      # restaurant/users=1) before the connector registers, so this only applies to
      # new topics. Connect's own topics set their counts explicitly (25/1/5).
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    container_name: connect
    networks: [default, cdc-net]
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    # Single source of truth: the repo-root .env feeds POSTGRES_* into the worker, so the
    # connector config (zomato-source.json) can reference them as ${env:POSTGRES_*}.
    env_file: ../../.env
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # Register the built-in env ConfigProvider so ${env:VAR} placeholders in connector
      # configs are substituted (CONNECT_* env vars map to worker config properties).
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      # Inside the cdc-net network the pipeline Postgres is reached by its service name, not
      # `localhost` (the value in .env is right for the host scripts). Overrides env_file.
      POSTGRES_HOST: postgres

  # One-shot, idempotent registration of the Debezium connector so the
  # postgres (zomato-source) -> Kafka wiring comes up automatically. Alternatively POST
  # zomato-source.json to http://localhost:8083/connectors by hand.
  connect-init:
    image: curlimages/curl:8.11.1
    container_name: connect-init
    depends_on:
      - connect
    volumes:
      - ./zomato-source.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://connect:8083/connectors >/dev/null 2>&1; do
          echo "waiting for Kafka Connect..."
          sleep 3
        done
        if curl -sf http://connect:8083/connectors/zomato-source >/dev/null 2>&1; then
          echo "connector 'zomato-source' already registered"
        else
          echo "registering connector 'zomato-source'"
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data @/connector.json http://connect:8083/connectors
        fi

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - connect
    ports:
      # Host 8090: 8080 is taken by the Airflow UI (docker/airflow). Container port stays 8080.
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

volumes:
  kafka_data:

networks:
  cdc-net:
    external: true