sources:
  - name: ai
    database: ZOMATO
    schema: AI
    description: "LLM-enriched tables produced by ai/enrich_reviews.py (OpenAI)."
    tables:
      - name: review_enriched
        description: "Per-review sentiment + topic + key issue from the LLM."
      - name: review_embeddings
        description: "Per-review vector embeddings written by embedding_reviews.py (Ollama nomic-embed-text)."
        columns:
          - name: review_id
            data_tests:
              - not_null