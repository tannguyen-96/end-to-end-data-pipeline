    "pyarrow>=26.0.0",
]

[project.scripts]
end-to-end-data-pipeline = "end_to_end_data_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
