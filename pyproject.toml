[project]
name = "end-to-end-data-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tan Nguyen", email = "nghoangtan96@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.111",
    "dbt-core>=1.12.5",
    "duckdb>=1.5.6",
    "kafka-python>=3.0.11",
    "pandas>=3.0.6",
